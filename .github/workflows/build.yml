name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Clé de signature
        env:
          KEYSTORE_B64: ${{ secrets.RANDO_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > app/rando.keystore
            echo "Signature avec la clé Rando"
          else
            echo "::warning::Secret RANDO_KEYSTORE_B64 absent : APK signé avec une clé de debug temporaire"
          fi

      - name: Compiler l'APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Renommer
        run: cp app/build/outputs/apk/release/app-release.apk "Rando-v0.1.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Rando-v0.1.${{ github.run_number }}
          path: Rando-v0.1.${{ github.run_number }}.apk

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.1.${{ github.run_number }}" "Rando-v0.1.${{ github.run_number }}.apk" \
            --title "Rando v0.1.${{ github.run_number }}" \
            --notes "APK généré automatiquement depuis ${{ github.sha }}." \
            --latest
